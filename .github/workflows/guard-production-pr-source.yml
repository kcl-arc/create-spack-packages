name: Guard Production PR Source

on:
  pull_request:
    branches: [production]
    types: [opened, reopened, synchronize, edited]

jobs:
  enforce-staging-source:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure PR source branch is staging
        run: |
          if [ "${{ github.head_ref }}" != "staging" ]; then
            echo "Only PRs from 'staging' to 'production' are allowed."
            echo "Current source branch: '${{ github.head_ref }}'"
            exit 1
          fi
